name: CI

on:
  push:
    branches: [main]
  pull_request:

# Z-2: read-only token; every action pinned by commit (a tag can be moved).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Cache tinygo image
        uses: ScribeMD/docker-cache@fb28c93772363301b8d0a6072ce850224b73f74e # 0.5.0
        with:
          # MED #36: key on the immutable digest pinned in the Makefile so a
          # re-pushed mutable tag can never reuse a stale cache under a new
          # image. `make build` pulls tinygo/tinygo@sha256:b216f534... directly.
          key: tinygo-sha256-b216f534ddbf277444407b014a3328b5c1ade403cc397f3ab48a14789bf99d0e

      - name: Build
        run: make build

      - name: Test
        run: make test
