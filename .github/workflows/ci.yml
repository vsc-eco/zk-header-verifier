name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache tinygo image
        uses: ScribeMD/docker-cache@0.5.0
        with:
          # MED #36: key on the immutable digest pinned in the Makefile so a
          # re-pushed mutable tag can never reuse a stale cache under a new
          # image. `make build` pulls tinygo/tinygo@sha256:b216f534... directly.
          key: tinygo-sha256-b216f534ddbf277444407b014a3328b5c1ade403cc397f3ab48a14789bf99d0e

      - name: Build
        run: make build

      - name: Test
        run: make test
